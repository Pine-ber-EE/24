    <body>
        <h2>How to play two player 24:</h2>
        <ul>
            <li><h4>Take a look at the card! There should be four numbers.</h4></li>
            <li><h4>Take the numbers on the card and use addition, subtraction, multiplication, and division to create the number 24!</h4></li>
            <li><h4>Press space to move onto the next card.</h4></li>
            <!--

            <li><h4>Once a team figures out a solution, press their side of the shift button (yellow = left shift, green = right shift).</h4></li>
            <li><h4>They have five seconds to explain their solution. If they suceed, they keep the card. If they fail, the other team gets the card.</h4></li>
            <li><h4>Whoever has the most cards at the end of the round wins!</h4></li>
            -->
        </ul>

        <button id="start">Start!</button>

        <div id="card" class="hidden">

        </div>
