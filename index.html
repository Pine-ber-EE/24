<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>24</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script> 
        <link rel="icon" href="favicon.ico" type="image/x-icon">
    </head>
    <body>
        <h1>How to play 24:</h1>
        <h4>• Look at the card! There should be four numbers.<br>• Use addition, subtraction, multiplication, and division to create the number 24!<br>• You need to use all four numbers, and exactly once each.<br>• Press space to move onto the next card.</h4>
        <!--
        <li><h4>There are two teams, yellow and green.</h4></li>
        <li><h4>Take the numbers on the card and use addition, subtraction, multiplication, and division to create the number 24!</h4></li>
        <li><h4>Once a team figures out a solution, press their side of the shift button (yellow = left shift, green = right shift).</h4></li>
        <li><h4>They have five seconds to explain their solution. If they suceed, they keep the card. If they fail, the other team gets the card.</h4></li>
        <li><h4>Whoever has the most cards at the end of the round wins!</h4></li>
        -->

        <button id="start">Start!</button>

        <div id="card">
            <h3>Click start to begin!</h3>
        </div>

        <button style="display: none;" id="solutionButton"> Show solutions</button>
        <h4 id="solutions"></h4>

    </body>
</html>
